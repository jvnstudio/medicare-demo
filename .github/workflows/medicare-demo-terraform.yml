name: Medicare GCP modernization workload validation

on:
  pull_request:
    paths:
      - "terraform/**"
      - ".github/workflows/medicare-demo-terraform.yml"
  push:
    branches:
      - main
    paths:
      - "terraform/**"
      - ".github/workflows/medicare-demo-terraform.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  terraform-validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.12.2

      - name: Terraform format
        run: terraform fmt -check -recursive

      - name: Terraform init without backend
        run: terraform init -input=false -backend=false

      - name: Terraform validate
        run: terraform validate

      - name: Deployment ownership notice
        run: |
          echo "Infrastructure Manager owns plan/apply/destroy and Terraform state for this workload."
          echo "GitHub Actions performs static Terraform validation only."
